openapi: 3.0.3
info:
  title: LLM Case Enrichment API
  version: 1.0.0
  description: >
    LLM 案例增强与推荐文案契约，覆盖增强运行创建、状态查询、重试与推荐文案生成。
    本契约依据 `.kiro/specs/llm-case-enrichment/design.md` 整理。
servers:
  - url: /api
tags:
  - name: Enrichment
    description: 案例增强接口
  - name: RecommendationCopy
    description: 推荐文案生成接口
paths:
  /a3-cases/{case_id}/enrichment-runs:
    post:
      tags: [Enrichment]
      summary: 创建案例增强运行
      operationId: createEnrichmentRun
      parameters:
        - $ref: '#/components/parameters/CaseIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrichmentRunRequest'
      responses:
        '200':
          description: 已接受增强请求并返回运行状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentRunResponse'
        '404':
          $ref: '#/components/responses/CaseNotFound'
        '409':
          $ref: '#/components/responses/EnrichmentConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/LlmUnavailable'
  /a3-cases/{case_id}/enrichment:
    get:
      tags: [Enrichment]
      summary: 查询案例当前增强状态
      operationId: getCaseEnrichmentStatus
      parameters:
        - $ref: '#/components/parameters/CaseIdPath'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseEnrichmentStatusResponse'
        '404':
          $ref: '#/components/responses/CaseNotFound'
  /recommendations/copy:
    post:
      tags: [RecommendationCopy]
      summary: 生成推荐文案（不改排序）
      operationId: generateRecommendationCopy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationCopyRequest'
      responses:
        '200':
          description: 生成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationCopyResponse'
        '503':
          $ref: '#/components/responses/LlmUnavailable'
  /enrichment-runs/{run_id}/retry:
    post:
      tags: [Enrichment]
      summary: 重试失败的增强运行
      operationId: retryEnrichmentRun
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
      responses:
        '200':
          description: 已接受重试请求并返回新运行状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentRunResponse'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '409':
          $ref: '#/components/responses/RetryNotAllowed'
        '503':
          $ref: '#/components/responses/LlmUnavailable'
components:
  parameters:
    CaseIdPath:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    RunIdPath:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
  responses:
    ValidationError:
      description: 请求参数或字段校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: request validation failed
            fields:
              - field: case_id
                message: case_id is required
    CaseNotFound:
      description: 案例不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CASE_NOT_FOUND
            message: case not found
    RunNotFound:
      description: 增强运行不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ENRICHMENT_RUN_NOT_FOUND
            message: enrichment run not found
    EnrichmentConflict:
      description: 案例当前状态不允许增强或运行状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ENRICHMENT_STATE_CONFLICT
            message: case is not eligible for enrichment
    RetryNotAllowed:
      description: 当前运行不允许重试
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: ENRICHMENT_RETRY_NOT_ALLOWED
            message: only retryable runs can be retried
    LlmUnavailable:
      description: LLM 调用失败或依赖不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            timeout:
              value:
                code: LLM_TIMEOUT
                message: llm request timeout
            provider_error:
              value:
                code: LLM_PROVIDER_ERROR
                message: llm provider error
            injection_risk_detected:
              value:
                code: INJECTION_RISK_DETECTED
                message: high risk prompt injection detected in input
                meta:
                  description: 输入侧高风险注入拦截，在调用 LLM 之前触发，阻断 LLM 调用
            injection_suspected:
              value:
                code: INJECTION_SUSPECTED
                message: suspected injection contamination in llm output
                meta:
                  description: 输出侧疑似注入污染，在 LLM 返回后 OutputValidator 校验阶段触发，阻断输出
  schemas:
    CreateEnrichmentRunRequest:
      type: object
      description: >
        触发增强运行的请求体。根据设计文档，MVP 阶段无必填业务字段；
        该对象预留扩展字段，不影响当前契约稳定性。
      additionalProperties: true
    EnrichmentTaskType:
      type: string
      enum: [case_enrichment]
    EnrichmentRunStatus:
      type: string
      enum: [running, succeeded, failed, validation_failed, retryable]
    ResultStatus:
      type: string
      enum: [valid, failed]
    BlockingLevel:
      type: string
      enum: [required, recommended]
    SourceField:
      type: string
      description: >
        案例源字段枚举，对应 A3Case 的核心内容字段。
        不包含 store_id 等关联标识字段。
      enum: [problem_description, context, root_cause, solution_steps, outcome]
    StructuredSuggestions:
      type: object
      required:
        - problem_type_suggestion
        - root_cause_category
        - applicable_scenarios
        - confidence_notes
      properties:
        problem_type_suggestion:
          type: string
        root_cause_category:
          type: string
          description: >
            根因类别建议。具体可选值由配置文件约束（暂缺），
            典型类别如：人员、设备、流程、环境等。
        applicable_scenarios:
          type: array
          items:
            type: string
          description: >
            适用场景列表。具体可选值由配置文件约束（暂缺），
            典型场景如：高峰期、节假日、新店开业等。
        confidence_notes:
          type: string
      additionalProperties: false
    MissingInformationItem:
      type: object
      required: [field, reason, blocking_level]
      properties:
        field:
          $ref: '#/components/schemas/SourceField'
        reason:
          type: string
        blocking_level:
          $ref: '#/components/schemas/BlockingLevel'
      additionalProperties: false
    CaseEnrichmentResult:
      type: object
      required:
        - enrichment_id
        - case_id
        - case_updated_at
        - status
        - structured_suggestions
        - tag_suggestions
        - source_references
        - output_version
        - created_at
        - updated_at
      properties:
        enrichment_id:
          type: string
        case_id:
          type: string
        case_updated_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ResultStatus'
        problem_summary:
          type: string
          nullable: true
        solution_summary:
          type: string
          nullable: true
        structured_suggestions:
          $ref: '#/components/schemas/StructuredSuggestions'
        tag_suggestions:
          type: array
          items:
            type: string
        source_references:
          type: array
          items:
            $ref: '#/components/schemas/SourceField'
        missing_information:
          type: array
          items:
            $ref: '#/components/schemas/MissingInformationItem'
        output_version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    EnrichmentRunResponse:
      type: object
      required:
        - run_id
        - case_id
        - task_type
        - status
        - model_id
        - request_purpose
        - case_updated_at
        - retry_count
        - started_at
      properties:
        run_id:
          type: string
        case_id:
          type: string
        task_type:
          $ref: '#/components/schemas/EnrichmentTaskType'
        status:
          $ref: '#/components/schemas/EnrichmentRunStatus'
        model_id:
          type: string
          example: deepseek-v4-pro
        request_purpose:
          type: string
          enum: [case_enrichment, recommendation_copy]
        case_updated_at:
          type: string
          format: date-time
        error_code:
          type: string
          nullable: true
        error_stage:
          type: string
          enum: [load_case, llm_call, parse, validate, persist]
          nullable: true
        retry_count:
          type: integer
          minimum: 0
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    CaseEnrichmentStatusResponse:
      type: object
      required: [case_id, latest_run, current_result]
      properties:
        case_id:
          type: string
        latest_run:
          allOf:
            - $ref: '#/components/schemas/EnrichmentRunResponse'
          nullable: true
        current_result:
          allOf:
            - $ref: '#/components/schemas/CaseEnrichmentResult'
          nullable: true
      additionalProperties: false
    RecommendationCandidate:
      type: object
      required: [case_id]
      properties:
        case_id:
          type: string
        case_summary:
          type: string
          description: 可选摘要信息，供文案生成使用
        source_fields:
          type: object
          description: 可选结构化引用字段快照
          additionalProperties: true
      additionalProperties: false
    RecommendationCopyRequest:
      type: object
      required: [query_text, candidates]
      properties:
        query_text:
          type: string
          minLength: 1
        candidates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RecommendationCandidate'
      additionalProperties: false
    RecommendationCopyItem:
      type: object
      required: [case_id, reason, reference_points, cautions, source_references]
      properties:
        case_id:
          type: string
        reason:
          type: string
        reference_points:
          type: array
          items:
            type: string
        cautions:
          type: array
          items:
            type: string
        source_references:
          type: array
          items:
            $ref: '#/components/schemas/SourceField'
      additionalProperties: false
    RecommendationCopyResponse:
      type: object
      required: [copy_run_id, status, items, schema_validation_status, created_at]
      properties:
        copy_run_id:
          type: string
        status:
          type: string
          enum: [succeeded, failed]
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationCopyItem'
        schema_validation_status:
          type: string
        model_id:
          type: string
        request_purpose:
          type: string
          enum: [recommendation_copy]
        token_usage:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    ErrorField:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - CASE_NOT_FOUND
            - ENRICHMENT_RUN_NOT_FOUND
            - ENRICHMENT_STATE_CONFLICT
            - ENRICHMENT_RETRY_NOT_ALLOWED
            - INJECTION_RISK_DETECTED
            - INJECTION_SUSPECTED
            - LLM_TIMEOUT
            - LLM_RATE_LIMITED
            - LLM_PROVIDER_ERROR
            - LLM_PRIVACY_CONFIG_MISSING
            - LLM_INVALID_RESPONSE
            - INTERNAL_ERROR
        message:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ErrorField'
        meta:
          type: object
          additionalProperties: true
      additionalProperties: false
