name: Frontend CI

on:
  push:
    paths:
      - 'frontend/**'
      - 'docs/contracts/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/contracts/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Contract types (regenerate + git diff)
        run: npm run verify:generated-types

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build
